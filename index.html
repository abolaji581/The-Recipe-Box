<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFF6DE;
    --card: #FFFDF6;
    --ink: #2B2A22;
    --ink-soft: #6B6650;
    --green: #3F5142;
    --green-deep: #2C3A2E;
    --gold: #F7C948;
    --gold-deep: #C99A1E;
    --rust: #A6503D;
    --line: #F0E2B4;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  a{color:inherit;}

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
    position:relative;
    z-index:1;
  }

  /* ---------- FLOATING BACKGROUND FOOD ---------- */
  .food-field{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .food-field span{
    position:absolute;
    font-size:34px;
    opacity:0.22;
    animation:drift 14s ease-in-out infinite;
    filter:saturate(0.9);
  }
  @keyframes drift{
    0%   { transform:translate(0,0) rotate(0deg); }
    50%  { transform:translate(14px,-22px) rotate(8deg); }
    100% { transform:translate(0,0) rotate(0deg); }
  }
  .food-field span:nth-child(1){ top:6%;  left:8%;  font-size:40px; animation-duration:16s; }
  .food-field span:nth-child(2){ top:14%; left:82%; font-size:30px; animation-duration:12s; animation-delay:-2s; }
  .food-field span:nth-child(3){ top:32%; left:4%;  font-size:26px; animation-duration:18s; animation-delay:-6s; }
  .food-field span:nth-child(4){ top:46%; left:90%; font-size:36px; animation-duration:15s; animation-delay:-3s; }
  .food-field span:nth-child(5){ top:64%; left:12%; font-size:32px; animation-duration:13s; animation-delay:-8s; }
  .food-field span:nth-child(6){ top:78%; left:85%; font-size:28px; animation-duration:17s; animation-delay:-4s; }
  .food-field span:nth-child(7){ top:88%; left:20%; font-size:38px; animation-duration:14s; animation-delay:-10s; }
  .food-field span:nth-child(8){ top:5%;  left:45%; font-size:24px; animation-duration:19s; animation-delay:-1s; }
  .food-field span:nth-child(9){ top:58%; left:48%; font-size:30px; animation-duration:16s; animation-delay:-7s; }
  .food-field span:nth-child(10){ top:94%; left:60%; font-size:26px; animation-duration:12s; animation-delay:-5s; }

  /* ---------- HEADER ---------- */
  header{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
  }
  .kicker-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .box-mark{
    width:34px;height:26px;
    border:2px solid var(--gold-deep);
    border-radius:3px;
    position:relative;
    flex-shrink:0;
  }
  .box-mark::before{
    content:"";
    position:absolute;
    top:-7px; left:6px;
    width:20px; height:8px;
    border:2px solid var(--gold-deep);
    border-bottom:none;
    border-radius:4px 4px 0 0;
  }
  .site-name{
    font-family:'Nunito';
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--ink-soft);
  }
  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:clamp(40px, 6vw, 68px);
    line-height:1.02;
    margin:0 0 18px;
    max-width:11ch;
  }
  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--rust);
  }
  .lede{
    font-size:18px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:46ch;
    margin:0;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    padding:28px 0 30px;
  }
  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'Nunito';
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover{ border-color:var(--gold-deep); color:var(--gold-deep); }
  .tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
  }

  .right-controls{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    font-family:'Nunito';
    font-size:14px;
    padding:9px 14px 9px 34px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--card);
    color:var(--ink);
    width:190px;
    outline:none;
    transition:border-color 0.15s ease;
  }
  .search-wrap input:focus{ border-color:var(--gold-deep); }
  .search-wrap svg{
    position:absolute;
    left:11px; top:50%;
    transform:translateY(-50%);
    width:14px; height:14px;
    stroke:var(--ink-soft);
  }

  .surprise-btn{
    font-family:'Nunito';
    font-size:14px;
    font-weight:600;
    padding:9px 18px;
    border-radius:5px;
    border:1px solid var(--rust);
    background:var(--rust);
    color:#FBF3EC;
    cursor:pointer;
    white-space:nowrap;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .surprise-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(166,80,61,0.28);
  }
  .surprise-btn:active{ transform:translateY(0); }

  /* ---------- COUNTRY SEGMENT ---------- */
  .country-section{
    padding-bottom:26px;
  }
  .country-heading{
    font-family:'Nunito';
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .country-chips{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:thin;
  }
  .country-chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Nunito';
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:22px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }
  .country-chip:hover{ transform:translateY(-1px); border-color:var(--gold-deep); }
  .country-chip.active{
    background:var(--gold);
    border-color:var(--gold);
  }
  .country-chip .flag{ font-size:16px; }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:26px 22px;
    padding-bottom:80px;
  }
  @media (max-width:820px){
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; }
    .controls{ flex-direction:column; align-items:stretch; }
    .right-controls{ justify-content:space-between; }
    .search-wrap input{ width:100%; }
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-top:4px solid var(--tag-color, var(--green));
    border-radius:2px;
    padding:22px 20px 20px;
    cursor:pointer;
    position:relative;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 1px 0 rgba(43,42,34,0.04);
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(43,42,34,0.10);
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    top:12px;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .card::before{ left:12px; }
  .card::after{ right:12px; }

  .card-tag{
    display:inline-block;
    font-size:12.5px;
    color:var(--tag-color, var(--green));
    font-weight:600;
    margin-bottom:10px;
  }
  .card h3{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:22px;
    line-height:1.2;
    margin:0 0 8px;
  }
  .card p.blurb{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 16px;
  }
  .card .meta{
    font-family:'Fredoka', sans-serif;
    font-style:italic;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .country-badge{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
    margin:0 0 10px;
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'Fredoka', sans-serif;
    font-style:italic;
    font-size:18px;
  }

  /* ---------- DETAIL OVERLAY ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(30,28,20,0.42);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{ display:flex; }

  .detail{
    background:var(--card);
    max-width:640px;
    width:100%;
    border-radius:3px;
    padding:40px 40px 44px;
    position:relative;
    border-top:5px solid var(--tag-color, var(--green));
    animation:riseIn 0.22s ease;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (max-width:560px){
    .detail{ padding:30px 22px 34px; }
  }

  .close-btn{
    position:absolute;
    top:18px; right:18px;
    width:30px; height:30px;
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:20px;
    line-height:1;
  }
  .close-btn:hover{ color:var(--ink); }

  .detail .card-tag{ margin-bottom:14px; }
  .detail h2{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:34px;
    line-height:1.08;
    margin:0 0 10px;
    max-width:20ch;
  }
  .detail .meta{
    font-family:'Fredoka', sans-serif;
    font-style:italic;
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  .listen-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:14px;
  }
  .listen-btn{
    font-family:'Nunito';
    font-size:14.5px;
    font-weight:700;
    padding:10px 20px;
    border-radius:20px;
    border:none;
    background:var(--gold-deep);
    color:#FFFDF6;
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .listen-btn:hover{ transform:translateY(-1px); }
  .listen-btn:active{ transform:translateY(0); }
  .voice-select{
    font-family:'Nunito';
    font-size:13px;
    padding:8px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    max-width:170px;
  }
  .listen-note{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:8px 0 0;
  }

  .detail-section{ margin-top:30px; }
  .detail-section h4{
    font-family:'Nunito';
    font-size:13.5px;
    font-weight:600;
    color:var(--gold-deep);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }

  .ingredients{
    list-style:none;
    margin:0; padding:0;
    display:grid;
    gap:9px;
  }
  .ingredients li{
    font-size:15px;
    line-height:1.5;
    padding-left:20px;
    position:relative;
  }
  .ingredients li::before{
    content:"";
    position:absolute;
    left:0; top:7px;
    width:7px; height:7px;
    border:1.5px solid var(--gold);
    border-radius:1px;
    transform:rotate(45deg);
  }

  .steps{
    list-style:none;
    margin:0; padding:0;
    counter-reset:step;
    display:grid;
    gap:18px;
  }
  .steps li{
    counter-increment:step;
    display:flex;
    gap:14px;
    font-size:15px;
    line-height:1.55;
  }
  .steps li::before{
    content:counter(step);
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--gold-deep);
    color:#FFFDF6;
    font-family:'Fredoka', sans-serif;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:26px 0 50px;
    font-size:13.5px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<div class="food-field" aria-hidden="true">
  <span>🍋</span>
  <span>🥐</span>
  <span>🍓</span>
  <span>🍳</span>
  <span>🥞</span>
  <span>🍫</span>
  <span>🍞</span>
  <span>🧈</span>
  <span>🍯</span>
  <span>🍒</span>
</div>

<div class="wrap">
  <header>
    <div class="kicker-row">
      <div class="box-mark"></div>
      <span class="site-name">The Recipe Box</span>
    </div>
    <h1>Cook something <em>good</em> tonight.</h1>
    <p class="lede">A small, honest collection of recipes worth keeping on an index card — the kind you'd actually cook twice.</p>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all">All recipes</button>
      <button class="tab" data-filter="Breakfast">Breakfast</button>
      <button class="tab" data-filter="Dinner">Dinner</button>
      <button class="tab" data-filter="Dessert">Dessert</button>
    </div>
    <div class="right-controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name, country, or ingredient">
      </div>
      <button class="surprise-btn" id="surpriseBtn">Surprise me</button>
    </div>
  </div>

  <div class="country-section">
    <h4 class="country-heading">Browse by country</h4>
    <div class="country-chips" id="countryChips"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="footerText">Recipes, cooked and re-cooked. More get added when something earns its place.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="detail" id="detailContent"></div>
</div>

<script>
const recipes = [
  {
    id: "pancakes",
    title: "Fluffy Buttermilk Pancakes",
    category: "Breakfast",
    country: "United States",
    flag: "🇺🇸",
    color: "#C99A1E",
    blurb: "Tall, tender stacks with a golden edge — the weekend kind.",
    time: "25 min",
    serves: "Serves 4 (about 12 pancakes)",
    ingredients: [
      "2 cups all-purpose flour",
      "2 tbsp sugar",
      "2 tsp baking powder",
      "1/2 tsp baking soda",
      "1/2 tsp salt",
      "2 cups buttermilk",
      "2 large eggs",
      "3 tbsp melted butter, plus more for the pan",
      "1 tsp vanilla extract"
    ],
    steps: [
      "Whisk the flour, sugar, baking powder, baking soda, and salt together in a large bowl.",
      "In a separate bowl, whisk the buttermilk, eggs, melted butter, and vanilla until smooth.",
      "Pour the wet ingredients into the dry and stir just until combined — a few lumps are fine. Overmixing makes tough pancakes.",
      "Let the batter rest for 5 minutes while you heat a griddle or nonstick pan over medium heat.",
      "Melt a little butter on the pan, then pour 1/4 cup batter per pancake. Cook until bubbles form across the surface and the edges look set, about 2–3 minutes.",
      "Flip and cook another 1–2 minutes, until golden. Serve warm with butter and syrup."
    ]
  },
  {
    id: "oatmeal",
    title: "Baked Oatmeal with Apples",
    category: "Breakfast",
    country: "United States",
    flag: "🇺🇸",
    color: "#C99A1E",
    blurb: "Cinnamon-warm, make-ahead, and better on day two.",
    time: "50 min",
    serves: "Serves 6",
    ingredients: [
      "2 cups old-fashioned rolled oats",
      "1 tsp baking powder",
      "1 1/2 tsp cinnamon",
      "1/2 tsp salt",
      "2 cups milk",
      "1 large egg",
      "1/3 cup maple syrup, plus more to serve",
      "3 tbsp melted butter",
      "1 tsp vanilla extract",
      "2 apples, cored and diced"
    ],
    steps: [
      "Preheat the oven to 375°F and butter an 8x8-inch baking dish.",
      "In a bowl, mix the oats, baking powder, cinnamon, and salt.",
      "In a separate bowl, whisk the milk, egg, maple syrup, melted butter, and vanilla.",
      "Scatter half the diced apple across the bottom of the dish. Spread the oats evenly on top, then scatter the remaining apple over the oats.",
      "Pour the wet mixture evenly over everything — don't stir once it's poured.",
      "Bake for 35–40 minutes, until the top is golden and set. Cool for 5 minutes, then serve with a drizzle of maple syrup."
    ]
  },
  {
    id: "shrimp-pasta",
    title: "Garlic Butter Shrimp Pasta",
    category: "Dinner",
    country: "Italy",
    flag: "🇮🇹",
    color: "#3F5142",
    blurb: "Fifteen minutes from pan to plate, and it never misses.",
    time: "20 min",
    serves: "Serves 3–4",
    ingredients: [
      "12 oz linguine or spaghetti",
      "1 lb large shrimp, peeled and deveined",
      "4 tbsp butter",
      "4 cloves garlic, minced",
      "1/2 tsp red pepper flakes",
      "1/2 cup dry white wine (or chicken broth)",
      "Juice of 1 lemon",
      "1/4 cup chopped parsley",
      "Salt and black pepper, to taste",
      "Grated parmesan, to serve"
    ],
    steps: [
      "Bring a large pot of salted water to a boil and cook the pasta until just shy of al dente. Reserve 1 cup of pasta water before draining.",
      "Meanwhile, pat the shrimp dry and season with salt and pepper.",
      "Melt half the butter in a large skillet over medium-high heat. Add the shrimp in a single layer and cook 1–2 minutes per side, until just pink. Remove and set aside.",
      "Add the remaining butter to the skillet with the garlic and red pepper flakes. Cook for 30 seconds, until fragrant.",
      "Pour in the wine, scraping up any browned bits, and let it bubble for a minute.",
      "Add the drained pasta to the skillet along with a splash of the reserved pasta water. Toss to coat, adding more water as needed to loosen the sauce.",
      "Return the shrimp to the pan, add the lemon juice and parsley, and toss once more. Finish with parmesan and serve immediately."
    ]
  },
  {
    id: "sheet-pan-chicken",
    title: "Sheet-Pan Lemon Chicken & Veggies",
    category: "Dinner",
    country: "United States",
    flag: "🇺🇸",
    color: "#3F5142",
    blurb: "One pan, minimal cleanup, and it looks after itself in the oven.",
    time: "45 min",
    serves: "Serves 4",
    ingredients: [
      "4 bone-in, skin-on chicken thighs",
      "1 lb baby potatoes, halved",
      "2 cups broccoli florets",
      "1 lemon, half sliced thin and half juiced",
      "4 tbsp olive oil",
      "3 cloves garlic, minced",
      "1 tsp dried oregano",
      "Salt and black pepper, to taste"
    ],
    steps: [
      "Preheat the oven to 425°F and line a large sheet pan with parchment.",
      "In a small bowl, whisk the olive oil, lemon juice, garlic, oregano, salt, and pepper.",
      "Toss the potatoes with half the dressing and spread them on the sheet pan. Roast for 15 minutes.",
      "Push the potatoes to one side. Add the chicken thighs skin-side up and brush with the remaining dressing. Tuck the lemon slices around the chicken.",
      "Roast for 20 minutes, then scatter the broccoli over the empty space on the pan, tossing it lightly in the pan juices.",
      "Roast another 10–12 minutes, until the chicken skin is golden and the potatoes are tender. Let rest 5 minutes before serving."
    ]
  },
  {
    id: "cookies",
    title: "Brown Butter Chocolate Chip Cookies",
    category: "Dessert",
    country: "United States",
    flag: "🇺🇸",
    color: "#A6503D",
    blurb: "The nutty depth of browned butter makes these hard to stop eating.",
    time: "40 min",
    serves: "Makes about 20 cookies",
    ingredients: [
      "1 cup butter",
      "1 cup brown sugar",
      "1/2 cup granulated sugar",
      "2 large eggs",
      "1 tsp vanilla extract",
      "2 1/4 cups all-purpose flour",
      "1 tsp baking soda",
      "1/2 tsp salt",
      "1 1/2 cups chocolate chips",
      "Flaky salt, for finishing"
    ],
    steps: [
      "Melt the butter in a light-colored saucepan over medium heat, swirling often, until it turns golden brown and smells nutty, about 5–6 minutes. Pour into a bowl to cool for 10 minutes.",
      "Whisk the browned butter with both sugars until smooth, then whisk in the eggs and vanilla.",
      "In a separate bowl, whisk the flour, baking soda, and salt. Fold into the wet mixture until just combined.",
      "Fold in the chocolate chips. Cover and chill the dough for at least 30 minutes (or up to overnight).",
      "Preheat the oven to 375°F and line two baking sheets with parchment.",
      "Scoop 2-tablespoon balls of dough onto the sheets, spaced well apart. Sprinkle with flaky salt.",
      "Bake for 10–12 minutes, until the edges are set but the centers still look slightly underdone. Cool on the pan for 5 minutes before moving."
    ]
  },
  {
    id: "lemon-bars",
    title: "Classic Lemon Bars",

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const detailContent = document.getElementById('detailContent');
const searchInput = document.getElementById('searchInput');
const tabs = document.querySelectorAll('.tab');
const countryChips = document.getElementById('countryChips');
let activeFilter = 'all';
let activeCountry = 'all';

function matchesSearch(recipe, query){
  if(!query) return true;
  const q = query.toLowerCase();
  if(recipe.title.toLowerCase().includes(q)) return true;
  if(recipe.country.toLowerCase().includes(q)) return true;
  return recipe.ingredients.some(i => i.toLowerCase().includes(q));
}

function buildCard(r){
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--tag-color', r.color);
  card.innerHTML = `
    <span class="card-tag">${r.category}</span>
    <h3>${r.title}</h3>
    <p class="blurb">${r.blurb}</p>
    <p class="country-badge">${r.flag} ${r.country}</p>
    <p class="meta">${r.time}, ${r.serves.toLowerCase()}</p>
  `;
  card.addEventListener('click', () => openDetail(r));
  return card;
}

function renderCountryChips(){
  const seen = new Map();
  recipes.forEach(r => { if(!seen.has(r.country)) seen.set(r.country, r.flag); });
  const countries = [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  countryChips.innerHTML = '';

  const allChip = document.createElement('button');
  allChip.className = 'country-chip active';
  allChip.textContent = 'All countries';
  allChip.addEventListener('click', () => selectCountry('all', allChip));
  countryChips.appendChild(allChip);

  countries.forEach(([country, flag]) => {
    const chip = document.createElement('button');
    chip.className = 'country-chip';
    chip.innerHTML = `<span class="flag">${flag}</span> ${country}`;
    chip.addEventListener('click', () => selectCountry(country, chip));
    countryChips.appendChild(chip);
  });
}

function selectCountry(country, chipEl){
  activeCountry = country;
  document.querySelectorAll('.country-chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');
  searchInput.value = '';
  render();
  grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render(){
  const query = searchInput.value.trim();
  const filtered = recipes.filter(r =>
    (activeFilter === 'all' || r.category === activeFilter)
    && (activeCountry === 'all' || r.country === activeCountry)
    && matchesSearch(r, query)
  );

  grid.innerHTML = '';

  if(filtered.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = query
      ? `Nothing from "${query}" on the shelf yet — here are a few worth trying instead:`
      : "Nothing on the shelf matches that.";
    grid.appendChild(empty);

    const suggestions = [...recipes].sort(() => 0.5 - Math.random()).slice(0, 3);
    suggestions.forEach(r => grid.appendChild(buildCard(r)));
    return;
  }

  filtered.forEach(r => grid.appendChild(buildCard(r)));
}

let currentUtterance = null;
let speechState = 'idle'; // idle | playing | paused
let availableVoices = [];
let chosenVoiceURI = null;

function loadVoices(){
  availableVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickDefaultVoice(){
  if(!availableVoices.length) return null;
  const englishVoices = availableVoices.filter(v => v.lang && v.lang.startsWith('en'));
  const pool = englishVoices.length ? englishVoices : availableVoices;
  const preferred = pool.find(v => /natural|premium|enhanced|neural/i.test(v.name))
    || pool.find(v => !v.localService)
    || pool[0];
  return preferred ? preferred.voiceURI : null;
}

function buildSpeechText(r){
  return r.steps.map((s, i) => `Step ${i + 1}. ${s}`).join(' ');
}

function updateListenBtn(){
  const btn = document.getElementById('listenBtn');
  if(!btn) return;
  if(speechState === 'playing'){
    btn.textContent = '⏸ Pause narration';
  } else if(speechState === 'paused'){
    btn.textContent = '▶ Resume narration';
  } else {
    btn.textContent = '▶ Listen to the steps';
  }
}

function toggleListen(r){
  if(!('speechSynthesis' in window)){
    alert("This browser doesn't support voice narration.");
    return;
  }
  if(speechState === 'playing'){
    window.speechSynthesis.pause();
    speechState = 'paused';
  } else if(speechState === 'paused'){
    window.speechSynthesis.resume();
    speechState = 'playing';
  } else {
    currentUtterance = new SpeechSynthesisUtterance(buildSpeechText(r));
    currentUtterance.rate = 0.92;
    currentUtterance.pitch = 1;
    const voice = availableVoices.find(v => v.voiceURI === chosenVoiceURI);
    if(voice) currentUtterance.voice = voice;
    currentUtterance.onend = () => { speechState = 'idle'; updateListenBtn(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(currentUtterance);
    speechState = 'playing';
  }
  updateListenBtn();
}

function stopListening(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
  speechState = 'idle';
  updateListenBtn();
}

function buildVoiceOptions(){
  if(!availableVoices.length) return '';
  if(!chosenVoiceURI) chosenVoiceURI = pickDefaultVoice();
  return `
    <select id="voiceSelect" class="voice-select">
      ${availableVoices
        .filter(v => v.lang && v.lang.startsWith('en'))
        .map(v => `<option value="${v.voiceURI}" ${v.voiceURI === chosenVoiceURI ? 'selected' : ''}>${v.name}</option>`)
        .join('')}
    </select>
  `;
}

function openDetail(r){
  stopListening();
  detailContent.style.setProperty('--tag-color', r.color);
  detailContent.innerHTML = `
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <span class="card-tag">${r.category}</span>
    <h2>${r.title}</h2>
    <p class="country-badge">${r.flag} ${r.country}</p>
    <p class="meta">${r.time} &nbsp;&bull;&nbsp; ${r.serves}</p>
    <div class="listen-row">
      <button class="listen-btn" id="listenBtn">▶ Listen to the steps</button>
      ${buildVoiceOptions()}
    </div>
    <p class="listen-note">Read aloud by a voice already on your device — pick a different one above if this one sounds too robotic. It's narration, not a real video.</p>
    <div class="detail-section">
      <h4>Ingredients</h4>
      <ul class="ingredients">
        ${r.ingredients.map(i => `<li>${i}</li>`).join('')}
      </ul>
    </div>
    <div class="detail-section">
      <h4>Steps</h4>
      <ol class="steps">
        ${r.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeDetail);
  document.getElementById('listenBtn').addEventListener('click', () => toggleListen(r));
  const voiceSelect = document.getElementById('voiceSelect');
  if(voiceSelect){
    voiceSelect.addEventListener('change', (e) => {
      chosenVoiceURI = e.target.value;
      stopListening();
    });
  }
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  stopListening();
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeDetail();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeDetail();
});

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    render();
  });
});

searchInput.addEventListener('input', render);

document.getElementById('surpriseBtn').addEventListener('click', () => {
  const pool = recipes.filter(r =>
    (activeFilter === 'all' || r.category === activeFilter)
    && (activeCountry === 'all' || r.country === activeCountry)
  );
  const source = pool.length ? pool : recipes;
  const pick = source[Math.floor(Math.random() * source.length)];
  openDetail(pick);
});

const countryCount = new Set(recipes.map(r => r.country)).size;
document.getElementById('footerText').textContent =
  `${recipes.length} recipes from ${countryCount} countries, cooked and re-cooked. More get added when something earns its place.`;

renderCountryChips();
render();
</script>
